<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20251f"><meta name="description" content="Seu calendário pessoal com tarefas por dia.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Meu Calendário</title>
<style>
:root{color-scheme:light;--bg:#f6f5f0;--card:#fff;--ink:#20251f;--muted:#777b72;--line:#e8e8e0;--accent:#526b50;--soft:#e8eee4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:680px;margin:auto;padding:24px 17px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--muted);font-weight:700}.title{font-size:27px;letter-spacing:-.04em;margin:4px 0 0}.button{border:0;border-radius:12px;padding:12px 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.outline{background:white;color:var(--ink);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:14px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:25px;margin-top:4px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.monthbar h2{font-size:18px;margin:0}.arrow{width:40px;height:40px;border:1px solid var(--line);background:white;border-radius:12px;font-size:22px;color:var(--ink)}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week div{text-align:center;font-size:11px;color:var(--muted);padding:7px 0}.day{min-height:47px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;cursor:pointer}.day.outside{opacity:.3}.day.selected{background:var(--soft);border-color:var(--accent);font-weight:800}.day.today:not(.selected){border-color:var(--accent);font-weight:800}.dots{display:flex;gap:3px;height:4px}.dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}.legend{font-size:11px;color:var(--muted);margin-top:13px}.detail{margin-top:14px}.detailhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.detail h2{font-size:21px;margin:4px 0}.pill{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;color:var(--muted);white-space:nowrap}.progresslabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:15px 0 7px}.track{height:5px;background:var(--line);border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}.tasks{margin:12px 0}.task{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:21px;height:21px;accent-color:var(--accent);flex-shrink:0;margin:2px 0 0}.taskmain{flex:1;min-width:0;overflow-wrap:anywhere}.task.done .tasktitle{text-decoration:line-through;color:var(--muted)}.tasktitle{font-size:14px;font-weight:600}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.del{border:0;background:transparent;color:var(--muted);font-size:21px;padding:0 5px;cursor:pointer}.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);margin-bottom:4px}.form{border-top:1px solid var(--line);padding-top:15px}.form label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit;font-size:16px;min-width:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.full{width:100%}.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:15px}.status{font-size:12px;color:var(--accent);min-height:18px;margin-top:8px}@media(max-width:360px){main{padding:18px 11px}.panel{padding:12px}.day{min-height:40px;font-size:12px}.days{gap:2px}.title{font-size:24px}}
</style>
</head>
<body><main>
<header class="top"><div><div class="eyebrow">ORGANIZE SEU TEMPO</div><h1 class="title">Meu calendário<span style="color:var(--accent)">.</span></h1></div><button class="button outline" id="today">Hoje ↗</button></header>
<section class="stats"><div class="stat"><small>Tarefas do mês</small><strong id="total">0</strong></div><div class="stat"><small>Concluídas</small><strong id="doneCount">0</strong></div><div class="stat"><small>A fazer</small><strong id="leftCount">0</strong></div></section>
<section class="panel"><div class="monthbar"><button class="arrow" id="prev" aria-label="Mês anterior">‹</button><div style="text-align:center"><h2 id="month"></h2><div style="font-size:11px;color:var(--muted);margin-top:3px">Toque em um dia para ver os detalhes</div></div><button class="arrow" id="next" aria-label="Próximo mês">›</button></div><div class="week" id="week"></div><div class="days" id="days"></div><div class="legend">● Tem tarefas &nbsp; ◯ Hoje</div></section>
<section class="panel detail"><div class="detailhead"><div><div class="eyebrow" id="daylabel">DETALHES DO DIA</div><h2 id="dateTitle"></h2></div><span class="pill" id="count">0 tarefas</span></div><div class="progresslabel"><span>Progresso do dia</span><span id="pct">0%</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="tasks" id="tasks"></div>
<form class="form" id="form"><label for="taskInput" style="font-weight:700;color:var(--ink);font-size:14px">Nova tarefa</label><input class="field" id="taskInput" maxlength="120" placeholder="Ex.: Estudar Python por 30 min" required><div class="row"><div><label for="time">Horário (opcional)</label><input class="field" id="time" type="time"></div><div><label for="category">Categoria</label><select class="field" id="category"><option>Pessoal</option><option>Estudos</option><option>Trabalho</option><option>Saúde</option><option>Outro</option></select></div></div><button class="button full" type="submit">＋ Adicionar tarefa</button><div class="status" id="status" aria-live="polite"></div></form></section>
<p class="hint">Seus dados são salvos neste dispositivo e neste navegador. Eles não são sincronizados com outros aparelhos.</p>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),now=new Date();const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const monthNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];const weekNames=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];let view=new Date(now.getFullYear(),now.getMonth(),1),selected=dateKey(now),seq=1;let data={};try{data=JSON.parse(localStorage.getItem('meu-calendario-tarefas')||'{}');Object.values(data).flat().forEach(t=>seq=Math.max(seq,(t.id||0)+1));}catch(e){data={};}const list=k=>data[k]||(data[k]=[]);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=k=>{let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});};function save(){try{localStorage.setItem('meu-calendario-tarefas',JSON.stringify(data));}catch(e){$('status').textContent='Não foi possível salvar neste navegador.';}}function render(){ $('month').textContent=monthNames[view.getMonth()]+' '+view.getFullYear();$('week').innerHTML=weekNames.map(x=>`<div>${x}</div>`).join('');let start=new Date(view.getFullYear(),view.getMonth(),1);start.setDate(start.getDate()-((start.getDay()+6)%7));let html='';for(let i=0;i<42;i++){let d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=dateKey(d),arr=list(k);html+=`<button type="button" class="day ${d.getMonth()!==view.getMonth()?'outside ':''}${k===selected?'selected ':''}${k===dateKey(now)?'today':''}" data-date="${k}" aria-pressed="${k===selected}"><span>${d.getDate()}</span><span class="dots">${arr.slice(0,3).map(()=>'<i class="dot"></i>').join('')}</span></button>`;}$('days').innerHTML=html;let prefix=dateKey(new Date(view.getFullYear(),view.getMonth(),1)).slice(0,7),all=Object.keys(data).filter(k=>k.startsWith(prefix)).flatMap(k=>data[k]);$('total').textContent=all.length;$('doneCount').textContent=all.filter(t=>t.done).length;$('leftCount').textContent=all.filter(t=>!t.done).length;renderDetail();}function renderDetail(){let arr=list(selected),done=arr.filter(t=>t.done).length,p=arr.length?Math.round(done/arr.length*100):0;$('daylabel').textContent=selected===dateKey(now)?'HOJE':'TAREFAS DO DIA';$('dateTitle').textContent=fmt(selected);$('count').textContent=arr.length+' '+(arr.length===1?'tarefa':'tarefas');$('pct').textContent=p+'%';$('fill').style.width=p+'%';$('tasks').innerHTML=arr.length?arr.map(t=>`<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" data-check="${t.id}" ${t.done?'checked':''} aria-label="Concluir tarefa"><div class="taskmain"><div class="tasktitle">${esc(t.title)}</div><div class="meta">${t.time?`<span class="pill">◷ ${t.time}</span>`:''}<span class="pill">${esc(t.category)}</span>${t.done?'<span class="pill">Concluída</span>':''}</div></div><button class="del" type="button" data-del="${t.id}" aria-label="Excluir tarefa">×</button></div>`).join(''):'<div class="empty"><strong>Dia livre por enquanto</strong>Adicione uma tarefa para começar a organizar seu dia.</div>';}$('days').addEventListener('click',e=>{let b=e.target.closest('[data-date]');if(!b)return;selected=b.dataset.date;let [y,m]=selected.split('-').map(Number);view=new Date(y,m-1,1);$('status').textContent='';render();$('tasks').scrollIntoView({behavior:'smooth',block:'nearest'});});$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};$('today').onclick=()=>{view=new Date(now.getFullYear(),now.getMonth(),1);selected=dateKey(now);render();};$('form').addEventListener('submit',e=>{e.preventDefault();let title=$('taskInput').value.trim();if(!title)return;list(selected).push({id:seq++,title,time:$('time').value,category:$('category').value,done:false});save();$('taskInput').value='';$('time').value='';$('status').textContent='Tarefa adicionada e salva neste dispositivo.';render();$('taskInput').focus();});$('tasks').addEventListener('change',e=>{let id=Number(e.target.dataset.check);if(!id)return;let t=list(selected).find(t=>t.id===id);if(t){t.done=e.target.checked;save();render();}});$('tasks').addEventListener('click',e=>{let b=e.target.closest('[data-del]');if(!b)return;data[selected]=list(selected).filter(t=>t.id!==Number(b.dataset.del));save();$('status').textContent='Tarefa excluída.';render();});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();})();
</script></body></html>
